name: Package RecompStudio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
            arch: x64
          - os: macos-14
            target: macos-arm64
            arch: arm64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install .

      - name: Package Windows GUI and CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RecompStudio --collect-data recompstudio scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli --collect-data recompstudio scripts/launch_cli.py
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/RecompStudio.exe release/RecompStudio.exe
          Copy-Item dist/recompstudio-cli.exe release/recompstudio-cli.exe
          Compress-Archive -Path release/RecompStudio.exe,release/recompstudio-cli.exe -DestinationPath release/RecompStudio-windows-x64.zip

      - name: Package macOS app and CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name RecompStudio --collect-data recompstudio scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli --collect-data recompstudio scripts/launch_cli.py
          mkdir -p release/dmg-root
          cp -R dist/RecompStudio.app release/dmg-root/RecompStudio.app
          cp dist/recompstudio-cli release/dmg-root/recompstudio-cli
          hdiutil create -volname "RecompStudio" -srcfolder release/dmg-root -ov -format UDZO "release/RecompStudio-${{ matrix.target }}.dmg"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name RecompStudio --collect-data recompstudio scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli --collect-data recompstudio scripts/launch_cli.py
          mkdir -p AppDir/usr/bin release
          cp -R dist/RecompStudio/. AppDir/usr/bin/
          cp dist/recompstudio-cli AppDir/usr/bin/recompstudio-cli
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/RecompStudio" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/RecompStudio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RecompStudio
          Comment=Cross-platform static recompilation studio
          Exec=RecompStudio
          Icon=utilities-terminal
          Categories=Development;Utility;
          Terminal=false
          EOF
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "release/RecompStudio-${{ matrix.target }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RecompStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
