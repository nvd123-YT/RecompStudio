name: Package RecompStudio

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recompstudio-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            toolchain: windows-x64
          - os: macos-15-intel
            target: macos-x64
            toolchain: macos-universal
          - os: macos-15
            target: macos-arm64
            toolchain: macos-universal
          - os: ubuntu-22.04
            target: linux-x86_64
            toolchain: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install .

      - name: Build embedded frameworks and platform toolchain
        run: python packaging/build_bundle.py --platform ${{ matrix.toolchain }}

      - name: Compile modules and run unit tests
        run: |
          python -m compileall -q recompstudio packaging
          python -m unittest discover -s tests -v

      - name: Package Windows GUI and CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name RecompStudio --add-data "recompstudio/bundled;recompstudio/bundled" scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli scripts/launch_cli.py
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/RecompStudio release/RecompStudio -Recurse
          Copy-Item dist/recompstudio-cli.exe release/recompstudio-cli.exe
          Copy-Item recompstudio/bundled/UPSTREAM_LICENSES.md release/UPSTREAM_LICENSES.md
          tar.exe -a -cf release/RecompStudio-${{ matrix.target }}.zip -C release RecompStudio recompstudio-cli.exe UPSTREAM_LICENSES.md

      - name: Package macOS app and CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name RecompStudio --add-data "recompstudio/bundled:recompstudio/bundled" scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli scripts/launch_cli.py
          mkdir -p release/dmg-root
          cp -R dist/RecompStudio.app release/dmg-root/RecompStudio.app
          cp dist/recompstudio-cli release/dmg-root/recompstudio-cli
          cp recompstudio/bundled/UPSTREAM_LICENSES.md release/dmg-root/UPSTREAM_LICENSES.md
          hdiutil create -volname "RecompStudio" -srcfolder release/dmg-root -ov -format UDZO "release/RecompStudio-${{ matrix.target }}.dmg"
          cp recompstudio/bundled/UPSTREAM_LICENSES.md release/UPSTREAM_LICENSES.md

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name RecompStudio --add-data "recompstudio/bundled:recompstudio/bundled" scripts/launch_gui.py
          pyinstaller --noconfirm --clean --onefile --name recompstudio-cli scripts/launch_cli.py
          mkdir -p AppDir/usr/bin release
          cp -R dist/RecompStudio AppDir/usr/bin/RecompStudio
          cp dist/recompstudio-cli AppDir/usr/bin/recompstudio-cli
          cp recompstudio/bundled/UPSTREAM_LICENSES.md AppDir/UPSTREAM_LICENSES.md
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export RECOMPSTUDIO_BUNDLED_ROOT="$HERE/usr/bin/RecompStudio/_internal/recompstudio/bundled"
          exec "$HERE/usr/bin/RecompStudio/RecompStudio" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/RecompStudio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RecompStudio
          Comment=Cross-platform static recompilation studio
          Exec=RecompStudio
          Icon=utilities-terminal
          Categories=Development;Utility;
          Terminal=false
          EOF
          python - <<'PY'
          import hashlib
          import json
          import urllib.request

          assets = [
              ("AppImage/appimagetool", "appimagetool-x86_64.AppImage", "appimagetool.AppImage"),
              ("AppImage/type2-runtime", "runtime-x86_64", "runtime-x86_64"),
          ]
          for repository, asset_name, destination in assets:
              api = f"https://api.github.com/repos/{repository}/releases/tags/continuous"
              request = urllib.request.Request(api, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "RecompStudio-Packager",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.loads(response.read().decode("utf-8"))
              match = next((item for item in release.get("assets", [])
                            if item.get("name") == asset_name), None)
              if not match:
                  raise SystemExit(f"Missing release asset {asset_name} from {repository}")
              download = urllib.request.Request(
                  match["browser_download_url"],
                  headers={"User-Agent": "RecompStudio-Packager",
                           "Accept": "application/octet-stream"},
              )
              digest = hashlib.sha256()
              with urllib.request.urlopen(download, timeout=180) as response, open(destination, "wb") as output:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      output.write(block)
                      digest.update(block)
              expected = str(match.get("digest", ""))
              if expected.startswith("sha256:") and digest.hexdigest().lower() != expected.split(":", 1)[1].lower():
                  raise SystemExit(f"SHA-256 mismatch for {asset_name}")
              print(f"Verified {repository}/{asset_name}")
          PY
          chmod +x appimagetool.AppImage runtime-x86_64
          ARCH=x86_64 APPIMAGETOOL_RUNTIME_FILE=./runtime-x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "release/RecompStudio-${{ matrix.target }}.AppImage"
          cp recompstudio/bundled/UPSTREAM_LICENSES.md release/UPSTREAM_LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RecompStudio {0}', github.ref_name) || 'RecompStudio Nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          overwrite_files: true
          generate_release_notes: true
          files: release-assets/*
