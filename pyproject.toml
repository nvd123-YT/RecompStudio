[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recompstudio"
version = "0.1.0"
description = "Cross-platform studio for managing static recompilation frameworks and game projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RecompStudio contributors" }]
keywords = ["recompilation", "static-recompiler", "retro-gaming", "game-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
recompstudio = "recompstudio.cli:main"

[project.gui-scripts]
RecompStudio = "recompstudio.gui:launch"

[tool.setuptools.packages.find]
include = ["recompstudio*"]

[tool.setuptools.package-data]
recompstudio = ["data/*.json", "bundled/**/*"]
